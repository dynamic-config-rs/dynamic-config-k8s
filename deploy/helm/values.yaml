# dynamic-config: the injector chart.
#
# Every value the templates read, in the order an operator meets them.
# The full reference with defaults and prose lives in this chart's
# README.md; the book's Install and Security pages carry the trades.

# ── Naming ───────────────────────────────────────────────────────────
# Resource names default to fixed, cluster-recognisable ones
# ("dynamic-config-webhook"); override only when running two releases
# side by side.
nameOverride: ""
fullnameOverride: ""

# Labels/annotations stamped on EVERY resource this chart renders.
commonLabels: {}
commonAnnotations: {}

# Pull credentials for private registries, applied to every component.
imagePullSecrets: []

# ── The agent (what gets injected) ───────────────────────────────────
# One agent per node instead of one beside every render, delivering
# configuration as a CSI volume.
#
# OFF, and the sidecar stays the default. It trades away the property the
# sidecar shape is built on — a sidecar holds one workload's credential;
# this process holds the store credentials of every pod on its node — and
# it runs as root, because the kubelet creates pod volume directories owned
# by root and a process that cannot write into them cannot publish.
#
# What it buys is the number it exists for: 10,000 pods at 2.5 renders each
# is 25,000 sidecar containers, and a node whose hundred pods read one
# Consul key opens one connection rather than a hundred.
#
# Not a better shape. A different trade, for a scale that makes the first
# one untenable.
nodeAgent:
  enabled: false
  image: ghcr.io/dynamic-config-rs/dynamic-config-node-agent
  tag: ""
  # Where the kubelet keeps its plugin and pod directories. `/var/lib/kubelet`
  # everywhere except a few distributions — k0s and some managed offerings
  # move it, and a wrong value is a driver the kubelet never registers.
  kubeletPath: /var/lib/kubelet
  metricsPort: 9111
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.13.0
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

agent:
  # Kubernetes Events written by the injected agent about its own pod, so
  # `kubectl describe pod` shows a render failure where somebody is already
  # looking rather than one `kubectl logs -c` away.
  #
  # OFF, and worth the sentence: the sidecar carries no API credential in
  # any other configuration. Turning this on puts a service account beside
  # every application that asks for it, to improve a diagnostic — a real
  # trade rather than an obvious win. The grant is `create` on `events`,
  # namespaced, and nothing more.
  #
  # `webhook.allowEvents` has to be true as well; the two are separate so
  # that a cluster can create the Roles ahead of letting pods ask.
  events:
    enabled: false
    # The namespaces to create the Role and RoleBinding in. Events are
    # namespaced, so there is no cluster-wide form of this and there should
    # not be.
    namespaces: []
    # The service accounts to bind. Empty binds every account in the
    # namespace, which is what works before somebody knows the names;
    # naming them is the better shape once they do.
    serviceAccounts: []
  image: ghcr.io/dynamic-config-rs/dynamic-config-agent
  tag: ""              # empty = the chart appVersion, v-prefixed (what release.yml pushes)
  digest: ""            # wins over tag when set — pin in production
  # The pull secret injected pods get (appended to their own) when the
  # agent image lives in a private mirror. Pull secrets are namespaced:
  # the Secret must exist in every namespace that injects.
  pullSecret: ""
  # Fleet-wide defaults for every injected container; the
  # `agent-cpu-request` (etc.) annotations still override per pod.
  # cpuLimit stays empty on purpose — throttling a config agent buys
  # nothing and delays reloads.
  defaults:
    cpuRequest: 10m
    memoryRequest: 32Mi
    memoryLimit: 64Mi
    cpuLimit: ""
    # The rendered file's octal permissions when a pod does not say
    # (empty = the agent's own 0644); `file-mode` still wins per pod.
    fileMode: ""
    # The default watch interval, whole seconds (empty = 15);
    # `watch-seconds` still wins per pod.
    watchSeconds: ""
    # The default injection mode: init | sidecar | both (empty = sidecar).
    mode: ""
    # The shared volume's default medium: memory | disk (empty = memory).
    volumeMedium: ""
    # "true" runs watching agents as native sidecars by default
    # (Kubernetes 1.29+); empty = false.
    nativeSidecar: ""
    # The injected container's default UID/GID (empty = 65532);
    # 0 is refused — the agent stays nonroot in every configuration.
    runAsUser: ""
    runAsGroup: ""
    # Serve agent metrics on this port by default; a pod opts out with
    # `metrics-port: "0"`, and an empty value here means no endpoint at all.
    #
    # On by default, because the port is also what the injected container's
    # readiness probe answers on: `/readyz` is 503 until a document has been
    # rendered, and pod readiness is AND-ed across containers — so a Service
    # sends no traffic to a pod whose configuration does not exist yet. A
    # pod that would rather start regardless says
    # `dynamic-config.rs/readiness: "false"`.
    metricsPort: 9110
    # Environment every injected agent gets, installer-set so no
    # allowlist applies; a pod's own `agent-env` overrides it name by
    # name. Same NAME=value grammar: "HTTPS_PROXY=http://egress:3128"
    env: ""
    # A fleet default SOURCE and PATH: with these (plus a per-store
    # endpoint and key below) a pod can deploy knowing nothing but
    # `inject: "true"`.
    source: ""
    path: ""
    # The default override mode: "true" (the default) lets pod
    # annotations override installation values; "false" pins every
    # value the installation SET (knobs it never set stay the pod's).
    # Per value, a trailing "!" pins and a trailing "?" opens,
    # whichever way this flag points. A pinned value refuses a
    # DIFFERING annotation at admission; the same value restated is
    # fine.
    overridable: ""
    # Per-STORE defaults, one tier above the fleet's: the value is the
    # same key=value grammar, keys spelled as the annotations spell
    # them — EVERY store-shaped annotation is available (endpoint,
    # endpoint-secret, key, token-secret, password-secret,
    # ca-configmap, tls-secret, ssh-secret, aws-secret, section, auth,
    # auth-mount, auth-role, auth-username, auth-token-path, namespace,
    # ref, api-url, template, template-configmap) plus every knob. A
    # pod's annotation still outranks both tiers, unless pinned:
    # "!" pins one value, "?" opens one value, and "overridable=false"
    # inside a group pins everything THAT store sets — the ladder is
    # per-value marker > per-store overridable > the flag above.
    # Each store's settings are a **map** — which is what you are already
    # writing — or the equivalent grammar as one string, which is what an
    # environment variable can carry and what this used to take.
    #
    #   perStore:
    #     vault:
    #       overridable: false
    #       endpoint: https://vault.vault.svc:8200
    #       auth: kubernetes
    #       watch-seconds: 30
    #     s3:
    #       agent-memory-limit: 128Mi
    #
    # The string form still works, per store:
    #
    #   perStore:
    #     s3: "agent-memory-limit=128Mi"
    #
    # A map travels to the pod as a mounted document and is rendered to
    # the grammar there, by the same parser the string goes through — so
    # the two spellings cannot mean different things.
    # Empty *string*, not an empty map, and the difference is not
    # cosmetic: helm refuses to overwrite a table with a non-table, so a
    # `{}` default makes the string form above impossible to set from a
    # values file — while a `""` default takes either, because a map
    # overwrites a string happily.
    perStore: ""

# ── The webhook ──────────────────────────────────────────────────────
webhook:
  metrics:
    # A plain-HTTP port for scraping, beside the mutual-TLS admission
    # port. The admission port still answers /metrics, so a scrape
    # already configured against it keeps working.
    enabled: true
    port: 9091
    serviceMonitor:
      # Only rendered where the Prometheus operator's CRD exists.
      enabled: false
      interval: 30s
      labels: {}
  # Which `agent-env` variable names pods may set on their injected
  # agents, and where. Empty = the annotation is refused everywhere.
  # Grammar: semicolons between groups, an optional `namespace:` head
  # on each (absent or `*` = every namespace), commas between names,
  # a trailing `*` on a name is a prefix glob. The webhook validates
  # this at startup and refuses to serve on a typo.
  # A **map** of namespace to the names allowed there, or the grammar as
  # one string. `"*"` is every namespace.
  #
  #   agentEnvAllow:
  #     payments: [HTTPS_PROXY, "AWS_*"]
  #     "*": [RUST_LOG]
  #
  #   agentEnvAllow: "payments: HTTPS_PROXY, AWS_*; *: RUST_LOG"
  agentEnvAllow: ""
  # Which STORES pods may use, and where — same grammar, names from
  # the source list. Empty = every store, everywhere; non-empty = ONLY
  # the listed. `sourceDeny` is the subtractive twin and outranks the
  # allowlist. Both validated at webhook startup.
  #   sourceAllow:
  #     payments: [vault, s3]
  #     "*": [consul]
  #   sourceDeny:
  #     sandbox: [git]
  #
  # Or, as one string each:
  #
  #   sourceAllow: "payments: vault, s3; *: consul"
  #   sourceDeny: "sandbox: git"
  sourceAllow: ""
  sourceDeny: ""
  # Whether a pod may set `dynamic-config.rs/tls-skip-verify`, which
  # connects to its store WITHOUT authenticating it — anything on the
  # network path can then supply that pod's configuration and its
  # credentials.
  #
  # Off, and this is the one annotation in the contract a workload cannot
  # reach on its own: it is a cluster's decision rather than a namespace's.
  # Try `ca-configmap` first — trusting one more certificate covers both
  # the self-signed development server and the enterprise private CA, and
  # keeps the server authenticated.
  #
  # Pods that use it still earn an admission warning, log a line at start,
  # and report `dynamic_config_agent_tls_verification_skipped 1`.
  allowTlsSkipVerify: false
  # Whether a pod may set `dynamic-config.rs/events`. Mirrors
  # `agent.events.enabled` below, and exists so a pod cannot ask for a
  # permission nobody granted and then fail at runtime with a 403.
  allowEvents: false
  # Image prefixes a pod may name in `dynamic-config.rs/agent-image` for its
  # own injected agent. Empty means no pod may, which is the default.
  #
  # The injected container runs beside the application holding the store's
  # credential, so an unconstrained image annotation is a way to run chosen
  # code there. A prefix list rather than exact names, because the useful
  # case is "our registry, any tag":
  #
  #   agentImageAllow: "ghcr.io/dynamic-config-rs/,registry.internal/config/"
  agentImageAllow: ""
  # Whether the webhook resolves `dynamic-config.rs/class` against the
  # cluster's DynamicConfigClass objects, so a pod names a store instead of
  # repeating its endpoint and auth.
  #
  # OFF, and the reason is the admission path: it calls the API server
  # nowhere, which is what keeps a busy API server from failing every pod
  # creation in the cluster. Enabling this does NOT put a call on that path
  # — the classes are listed on a background timer into memory and
  # admission reads the map — but it does give the webhook a credential and
  # a cluster-wide read of two custom resources, which is worth having only
  # if pods actually name classes.
  #
  # The synchronisation delay is the one a mounted ConfigMap already has: a
  # class created seconds ago may not have been polled yet, and a pod
  # naming it is refused with that sentence rather than admitted without a
  # store.
  classes:
    enabled: false
  image: ghcr.io/dynamic-config-rs/dynamic-config-webhook
  tag: ""              # empty = the chart appVersion, v-prefixed (what release.yml pushes)
  digest: ""
  imagePullPolicy: IfNotPresent
  replicas: 2

  # The port the webhook binds. `hostNetwork: true` is for clusters
  # whose CNI keeps the API server off the pod network (EKS custom
  # networking is the usual case) — pick a collision-free port there.
  port: 8443
  hostNetwork: false
  # Only meaningful with hostNetwork; ClusterFirstWithHostNet keeps
  # in-cluster DNS working from the host network namespace.
  dnsPolicy: ""

  serviceAccount:
    create: true
    name: ""            # defaults to the webhook's fullname
    annotations: {}

  # How the webhook gets its serving certificate.
  #
  # `certManager.enabled: false` (the default) — the chart generates a
  # CA and a certificate at install time, embeds the caBundle in the
  # webhook configuration, and reuses the Secret on upgrade. No
  # dependency; rotate by deleting the Secret and upgrading.
  #
  # `certManager.enabled: true` — cert-manager issues and RENEWS the
  # certificate, cainjector maintains the caBundle, and the webhook
  # reloads the pair from disk without a restart.
  certManager:
    enabled: false
    issuerRef:
      name: ""          # required when enabled: a ClusterIssuer or Issuer
      kind: ClusterIssuer
    duration: ""        # e.g. 2160h; cert-manager's default when empty
    renewBefore: ""     # e.g. 360h
  # Days of validity for the self-signed pair (certManager disabled).
  selfSignedDays: 3650

  # `selfRotate.enabled: true` — the third mode: the webhook is its own
  # certificate authority. It mints a CA and leaf IN MEMORY at rotation
  # time, writes the pair to its own Secret (every replica serves it
  # via the file hot-reload), and patches the webhook configuration's
  # caBundle itself — the Vault-agent-injector shape. No dependency,
  # AND it rotates: a fresh pair every 24h, leader-elected over a
  # Lease so replicas do not race.
  #
  # The price, stated here beside failurePolicy because they are the
  # same trade: the webhook gets a service-account token and three
  # narrow permissions (its one Secret, its one webhook configuration
  # by name, leases in this namespace) — the pure zero-RBAC posture of
  # the other two modes is deliberately given up for rotation.
  selfRotate:
    enabled: false

  # `Ignore` fails OPEN: an unreachable webhook lets pods through
  # un-injected, and the pod that asked shows the gap loudly (its file
  # never appears). `Fail` closes the gap and couples pod CREATEs in
  # selected namespaces to this webhook's availability.
  failurePolicy: Ignore
  timeoutSeconds: 5
  reinvocationPolicy: Never

  # Namespaces the webhook never touches, beyond its own, kube-system
  # and kube-node-lease.
  excludeNamespaces: []
  # Opt-in: when true, only namespaces labeled
  #   dynamic-config.rs/injection: enabled
  # are selected at all — and `failurePolicy: Fail` becomes a
  # per-namespace promise instead of a cluster-wide one.
  namespaceGating: false
  # An additional objectSelector for the webhook configuration, verbatim.
  objectSelector: {}

  service:
    type: ClusterIP
    port: 443
    annotations: {}

  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

  # Probes, tunable per cluster speed; paths and scheme are fixed by
  # the binary (HTTPS /healthz on `port`).
  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 20
    failureThreshold: 3

  # Rollout shape.
  strategy: {}          # verbatim `spec.strategy` when set
  revisionHistoryLimit: 10
  minReadySeconds: 0
  terminationGracePeriodSeconds: 30

  # Spread the replicas; soft, so single-node clusters still schedule.
  topologySpread: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

  # Escape hatches, rendered verbatim into the webhook container/pod.
  extraEnv: []          # e.g. [{ name: RUST_LOG, value: debug }]
  extraVolumeMounts: []
  extraVolumes: []

# The webhook needs no egress at all and only the API server calls in;
# this policy writes both facts down. Off by default because a cluster
# without a network plugin enforcing policies silently ignores it.
networkPolicy:
  enabled: false

# ── The operator (optional; the CRDs install either way) ─────────────
operator:
  enabled: false
  # Spare capacity, not throughput: the replicas contend for a Lease and
  # only the holder reconciles. Two means a leader that dies is replaced
  # within the lease's fifteen-second term rather than when the kubelet
  # gets round to restarting the pod.
  replicas: 1
  podDisruptionBudget:
    # Only applied above one replica. A budget over a single replica
    # blocks every node drain in the cluster, which is a worse outage
    # than the one it prevents.
    enabled: true
    spec:
      minAvailable: 1
  image: ghcr.io/dynamic-config-rs/dynamic-config-operator
  tag: ""              # empty = the chart appVersion, v-prefixed (what release.yml pushes)
  digest: ""
  imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
