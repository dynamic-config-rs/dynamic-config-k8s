# dynamic-config: the injector chart.
#
# Every value the templates read, in the order an operator meets them.
# The full reference with defaults and prose lives in this chart's
# README.md; the book's Install and Security pages carry the trades.

# ── Naming ───────────────────────────────────────────────────────────
# Resource names default to fixed, cluster-recognisable ones
# ("dynamic-config-webhook"); override only when running two releases
# side by side.
nameOverride: ""
fullnameOverride: ""

# Labels/annotations stamped on EVERY resource this chart renders.
commonLabels: {}
commonAnnotations: {}

# Pull credentials for private registries, applied to every component.
imagePullSecrets: []

# ── The agent (what gets injected) ───────────────────────────────────
agent:
  image: ghcr.io/dynamic-config-rs/dynamic-config-agent
  tag: ""              # empty = the chart appVersion, v-prefixed (what release.yml pushes)
  digest: ""            # wins over tag when set — pin in production
  # The pull secret injected pods get (appended to their own) when the
  # agent image lives in a private mirror. Pull secrets are namespaced:
  # the Secret must exist in every namespace that injects.
  pullSecret: ""
  # Fleet-wide defaults for every injected container; the
  # `agent-cpu-request` (etc.) annotations still override per pod.
  # cpuLimit stays empty on purpose — throttling a config agent buys
  # nothing and delays reloads.
  defaults:
    cpuRequest: 10m
    memoryRequest: 32Mi
    memoryLimit: 64Mi
    cpuLimit: ""
    # The rendered file's octal permissions when a pod does not say
    # (empty = the agent's own 0644); `file-mode` still wins per pod.
    fileMode: ""
    # The default watch interval, whole seconds (empty = 15);
    # `watch-seconds` still wins per pod.
    watchSeconds: ""
    # The default injection mode: init | sidecar | both (empty = sidecar).
    mode: ""
    # The shared volume's default medium: memory | disk (empty = memory).
    volumeMedium: ""
    # "true" runs watching agents as native sidecars by default
    # (Kubernetes 1.29+); empty = false.
    nativeSidecar: ""
    # The injected container's default UID/GID (empty = 65532);
    # 0 is refused — the agent stays nonroot in every configuration.
    runAsUser: ""
    runAsGroup: ""
    # Serve agent metrics on this port by default (empty = no metrics
    # endpoint); a pod opts out with `metrics-port: "0"`.
    metricsPort: ""
    # Environment every injected agent gets, installer-set so no
    # allowlist applies; a pod's own `agent-env` overrides it name by
    # name. Same NAME=value grammar: "HTTPS_PROXY=http://egress:3128"
    env: ""
    # Per-STORE defaults, one tier above the fleet's: the value is the
    # same key=value grammar, keys spelled as the annotations spell
    # them. A pod's annotation still outranks both tiers.
    #   perStore:
    #     vault: "watch-seconds=30, file-mode=0640"
    #     s3: "agent-memory-limit=128Mi"
    perStore: {}

# ── The webhook ──────────────────────────────────────────────────────
webhook:
  # Which `agent-env` variable names pods may set on their injected
  # agents, and where. Empty = the annotation is refused everywhere.
  # Grammar: semicolons between groups, an optional `namespace:` head
  # on each (absent or `*` = every namespace), commas between names,
  # a trailing `*` on a name is a prefix glob. The webhook validates
  # this at startup and refuses to serve on a typo.
  #   agentEnvAllow: "payments: HTTPS_PROXY, AWS_*; *: RUST_LOG"
  agentEnvAllow: ""
  # Which STORES pods may use, and where — same grammar, names from
  # the source list. Empty = every store, everywhere; non-empty = ONLY
  # the listed. `sourceDeny` is the subtractive twin and outranks the
  # allowlist. Both validated at webhook startup.
  #   sourceAllow: "payments: vault, s3; *: consul"
  #   sourceDeny: "sandbox: git"
  sourceAllow: ""
  sourceDeny: ""
  image: ghcr.io/dynamic-config-rs/dynamic-config-webhook
  tag: ""              # empty = the chart appVersion, v-prefixed (what release.yml pushes)
  digest: ""
  imagePullPolicy: IfNotPresent
  replicas: 2

  # The port the webhook binds. `hostNetwork: true` is for clusters
  # whose CNI keeps the API server off the pod network (EKS custom
  # networking is the usual case) — pick a collision-free port there.
  port: 8443
  hostNetwork: false
  # Only meaningful with hostNetwork; ClusterFirstWithHostNet keeps
  # in-cluster DNS working from the host network namespace.
  dnsPolicy: ""

  serviceAccount:
    create: true
    name: ""            # defaults to the webhook's fullname
    annotations: {}

  # How the webhook gets its serving certificate.
  #
  # `certManager.enabled: false` (the default) — the chart generates a
  # CA and a certificate at install time, embeds the caBundle in the
  # webhook configuration, and reuses the Secret on upgrade. No
  # dependency; rotate by deleting the Secret and upgrading.
  #
  # `certManager.enabled: true` — cert-manager issues and RENEWS the
  # certificate, cainjector maintains the caBundle, and the webhook
  # reloads the pair from disk without a restart.
  certManager:
    enabled: false
    issuerRef:
      name: ""          # required when enabled: a ClusterIssuer or Issuer
      kind: ClusterIssuer
    duration: ""        # e.g. 2160h; cert-manager's default when empty
    renewBefore: ""     # e.g. 360h
  # Days of validity for the self-signed pair (certManager disabled).
  selfSignedDays: 3650

  # `selfRotate.enabled: true` — the third mode: the webhook is its own
  # certificate authority. It mints a CA and leaf IN MEMORY at rotation
  # time, writes the pair to its own Secret (every replica serves it
  # via the file hot-reload), and patches the webhook configuration's
  # caBundle itself — the Vault-agent-injector shape. No dependency,
  # AND it rotates: a fresh pair every 24h, leader-elected over a
  # Lease so replicas do not race.
  #
  # The price, stated here beside failurePolicy because they are the
  # same trade: the webhook gets a service-account token and three
  # narrow permissions (its one Secret, its one webhook configuration
  # by name, leases in this namespace) — the pure zero-RBAC posture of
  # the other two modes is deliberately given up for rotation.
  selfRotate:
    enabled: false

  # `Ignore` fails OPEN: an unreachable webhook lets pods through
  # un-injected, and the pod that asked shows the gap loudly (its file
  # never appears). `Fail` closes the gap and couples pod CREATEs in
  # selected namespaces to this webhook's availability.
  failurePolicy: Ignore
  timeoutSeconds: 5
  reinvocationPolicy: Never

  # Namespaces the webhook never touches, beyond its own, kube-system
  # and kube-node-lease.
  excludeNamespaces: []
  # Opt-in: when true, only namespaces labeled
  #   dynamic-config.rs/injection: enabled
  # are selected at all — and `failurePolicy: Fail` becomes a
  # per-namespace promise instead of a cluster-wide one.
  namespaceGating: false
  # An additional objectSelector for the webhook configuration, verbatim.
  objectSelector: {}

  service:
    type: ClusterIP
    port: 443
    annotations: {}

  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

  # Probes, tunable per cluster speed; paths and scheme are fixed by
  # the binary (HTTPS /healthz on `port`).
  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 20
    failureThreshold: 3

  # Rollout shape.
  strategy: {}          # verbatim `spec.strategy` when set
  revisionHistoryLimit: 10
  minReadySeconds: 0
  terminationGracePeriodSeconds: 30

  # Spread the replicas; soft, so single-node clusters still schedule.
  topologySpread: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

  # Escape hatches, rendered verbatim into the webhook container/pod.
  extraEnv: []          # e.g. [{ name: RUST_LOG, value: debug }]
  extraVolumeMounts: []
  extraVolumes: []

# The webhook needs no egress at all and only the API server calls in;
# this policy writes both facts down. Off by default because a cluster
# without a network plugin enforcing policies silently ignores it.
networkPolicy:
  enabled: false

# ── The operator (0.3.0's half; the CRDs install either way) ─────────
operator:
  enabled: false
  image: ghcr.io/dynamic-config-rs/dynamic-config-operator
  tag: ""              # empty = the chart appVersion, v-prefixed (what release.yml pushes)
  digest: ""
  imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
