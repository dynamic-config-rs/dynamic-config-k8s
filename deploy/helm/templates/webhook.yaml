{{/*
Everything that must agree on one certificate lives in this one file,
computed once: the Secret, the Deployment's rollout checksum and the
webhook configuration's caBundle. Three separate templates would each
call the generator and mint three different CAs.
*/}}
{{- $fullname := include "dynamic-config.webhook.fullname" . }}
{{- if and .Values.webhook.certManager.enabled .Values.webhook.selfRotate.enabled }}
{{- fail "webhook.certManager and webhook.selfRotate are two answers to one question: enable at most one" }}
{{- end }}
{{- $selfRotate := .Values.webhook.selfRotate.enabled }}
{{- $tls := dict }}
{{- if and (not .Values.webhook.certManager.enabled) (not $selfRotate) }}
{{- $tls = include "dynamic-config.selfSignedTls" . | fromYaml }}
{{- end }}
{{- if .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  secretName: {{ $fullname }}-tls
  dnsNames:
    - {{ $fullname }}.{{ .Release.Namespace }}.svc
    - {{ $fullname }}.{{ .Release.Namespace }}
  {{- with .Values.webhook.certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.webhook.certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
  issuerRef:
    name: {{ required "webhook.certManager.issuerRef.name is required when certManager is enabled" .Values.webhook.certManager.issuerRef.name }}
    kind: {{ .Values.webhook.certManager.issuerRef.kind }}
{{- else if $selfRotate }}
{{- if not (lookup "v1" "Secret" .Release.Namespace (printf "%s-tls" $fullname)) }}
{{/* An empty vessel the webhook fills and rotates; `lookup` keeps an
     upgrade from resetting a pair already minted. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-tls
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
{{- end }}
---
# The narrow price of selfRotate, all of it: ONE secret and leases in
# this namespace, ONE webhook configuration by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-selfrotate
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: ["{{ $fullname }}-tls"]
    verbs: [get, patch, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [dynamic-config-webhook-rotation]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-selfrotate
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-selfrotate
subjects:
  - kind: ServiceAccount
    name: {{ include "dynamic-config.webhook.serviceAccountName" . }}
    namespace: "{{ .Release.Namespace }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dynamic-config.fullname" . }}-selfrotate
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: ["{{ include "dynamic-config.fullname" . }}"]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dynamic-config.fullname" . }}-selfrotate
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dynamic-config.fullname" . }}-selfrotate
subjects:
  - kind: ServiceAccount
    name: {{ include "dynamic-config.webhook.serviceAccountName" . }}
    namespace: "{{ .Release.Namespace }}"
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-tls
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tls.crt }}
  tls.key: {{ $tls.key }}
  ca.crt: {{ $tls.ca }}
{{- end }}
{{- if .Values.webhook.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dynamic-config.webhook.serviceAccountName" . }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.webhook.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Outside selfRotate the webhook talks to nobody — not even the API
# server — and a token it does not hold is a token nothing can steal.
# selfRotate is exactly the trade of that purity for rotation, so the
# token exists only there, mounted at the pod.
automountServiceAccountToken: false
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  revisionHistoryLimit: {{ .Values.webhook.revisionHistoryLimit }}
  {{- with .Values.webhook.minReadySeconds }}
  minReadySeconds: {{ . }}
  {{- end }}
  {{- with .Values.webhook.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "dynamic-config.webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dynamic-config.labels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
        {{- with .Values.webhook.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (and (not .Values.webhook.certManager.enabled) (not $selfRotate)) .Values.webhook.podAnnotations .Values.commonAnnotations }}
      annotations:
        {{- if and (not .Values.webhook.certManager.enabled) (not $selfRotate) }}
        # Roll the pods when the generated certificate changes; the
        # webhook also reloads from disk, this covers the fresh-install
        # race where the Secret lands after the pod started.
        checksum/tls: {{ $tls.crt | sha256sum }}
        {{- end }}
        {{- with .Values.webhook.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dynamic-config.webhook.serviceAccountName" . }}
      automountServiceAccountToken: {{ $selfRotate }}
      terminationGracePeriodSeconds: {{ .Values.webhook.terminationGracePeriodSeconds }}
      {{- if .Values.webhook.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.webhook.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- else if .Values.webhook.dnsPolicy }}
      dnsPolicy: {{ .Values.webhook.dnsPolicy }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.webhook.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.webhook.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "dynamic-config.webhook.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.webhook.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webhook
          image: {{ include "dynamic-config.image" (dict "component" .Values.webhook "root" $) | quote }}
          imagePullPolicy: {{ .Values.webhook.imagePullPolicy }}
          env:
            - name: DYNAMIC_CONFIG_AGENT_IMAGE
              value: {{ include "dynamic-config.image" (dict "component" .Values.agent "root" $) | quote }}
            - name: DYNAMIC_CONFIG_WEBHOOK_ADDR
              value: "0.0.0.0:{{ .Values.webhook.port }}"
            - name: DYNAMIC_CONFIG_AGENT_CPU_REQUEST
              value: {{ .Values.agent.defaults.cpuRequest | quote }}
            - name: DYNAMIC_CONFIG_AGENT_MEMORY_REQUEST
              value: {{ .Values.agent.defaults.memoryRequest | quote }}
            - name: DYNAMIC_CONFIG_AGENT_MEMORY_LIMIT
              value: {{ .Values.agent.defaults.memoryLimit | quote }}
            {{- with .Values.agent.defaults.cpuLimit }}
            - name: DYNAMIC_CONFIG_AGENT_CPU_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.pullSecret }}
            - name: DYNAMIC_CONFIG_AGENT_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.fileMode }}
            - name: DYNAMIC_CONFIG_AGENT_FILE_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.watchSeconds }}
            - name: DYNAMIC_CONFIG_AGENT_WATCH_SECONDS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.mode }}
            - name: DYNAMIC_CONFIG_AGENT_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.volumeMedium }}
            - name: DYNAMIC_CONFIG_AGENT_VOLUME_MEDIUM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.nativeSidecar }}
            - name: DYNAMIC_CONFIG_AGENT_NATIVE_SIDECAR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.runAsUser }}
            - name: DYNAMIC_CONFIG_AGENT_RUN_AS_USER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.runAsGroup }}
            - name: DYNAMIC_CONFIG_AGENT_RUN_AS_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.metricsPort }}
            - name: DYNAMIC_CONFIG_AGENT_METRICS_PORT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.env }}
            - name: DYNAMIC_CONFIG_AGENT_ENV
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.source }}
            - name: DYNAMIC_CONFIG_AGENT_SOURCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.agent.defaults.path }}
            - name: DYNAMIC_CONFIG_AGENT_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- if ne (toString .Values.agent.defaults.overridable) "" }}
            - name: DYNAMIC_CONFIG_AGENT_DEFAULTS_OVERRIDABLE
              value: {{ .Values.agent.defaults.overridable | toString | quote }}
            {{- end }}
            {{/* Each of these takes a string — the grammar — or a map.
                 A string goes on as the variable it always was; a map
                 goes into the mounted installation document instead, so
                 that the readable form is readable all the way to the
                 pod rather than being flattened here. */}}
            {{- if kindIs "string" .Values.agent.defaults.perStore }}
            {{- with .Values.agent.defaults.perStore }}
            - name: DYNAMIC_CONFIG_AGENT_STORE_DEFAULTS
              value: {{ . | quote }}
            {{- end }}
            {{- else if .Values.agent.defaults.perStore }}
            {{- $groups := list }}
            {{- range $store, $knobs := .Values.agent.defaults.perStore }}
            {{- if kindIs "string" $knobs }}
            {{- $groups = append $groups (printf "%s: %s" $store $knobs) }}
            {{- end }}
            {{- end }}
            {{- if $groups }}
            - name: DYNAMIC_CONFIG_AGENT_STORE_DEFAULTS
              value: {{ join "; " $groups | quote }}
            {{- end }}
            {{- end }}
            {{- if kindIs "string" .Values.webhook.agentEnvAllow }}
            {{- with .Values.webhook.agentEnvAllow }}
            - name: DYNAMIC_CONFIG_WEBHOOK_AGENT_ENV_ALLOW
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if kindIs "string" .Values.webhook.sourceAllow }}
            {{- with .Values.webhook.sourceAllow }}
            - name: DYNAMIC_CONFIG_WEBHOOK_SOURCE_ALLOW
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if kindIs "string" .Values.webhook.sourceDeny }}
            {{- with .Values.webhook.sourceDeny }}
            - name: DYNAMIC_CONFIG_WEBHOOK_SOURCE_DENY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if (include "dynamic-config.installationDocument" .) }}
            - name: DYNAMIC_CONFIG_WEBHOOK_DEFAULTS_FILE
              value: /etc/dynamic-config/installation.yaml
            {{- end }}
            {{- if $selfRotate }}
            - name: DYNAMIC_CONFIG_WEBHOOK_SELF_ROTATE
              value: "1"
            - name: DYNAMIC_CONFIG_WEBHOOK_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: DYNAMIC_CONFIG_WEBHOOK_SERVICE
              value: {{ $fullname | quote }}
            - name: DYNAMIC_CONFIG_WEBHOOK_TLS_SECRET
              value: "{{ $fullname }}-tls"
            - name: DYNAMIC_CONFIG_WEBHOOK_MWC
              value: {{ include "dynamic-config.fullname" . | quote }}
            {{- end }}
            {{- if .Values.webhook.metrics.enabled }}
            {{/* A port of its own, in plain HTTP. The admission port is
                 mutual TLS against a CA this webhook mints for itself, so
                 scraping it meant handing Prometheus a client certificate
                 from that CA — which most deployments did not, and so had
                 no metrics at all. */}}
            - name: DYNAMIC_CONFIG_WEBHOOK_METRICS_ADDR
              value: "0.0.0.0:{{ .Values.webhook.metrics.port }}"
            {{- end }}
            {{- with .Values.webhook.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.webhook.port }}
              name: https
            {{- if .Values.webhook.metrics.enabled }}
            - containerPort: {{ .Values.webhook.metrics.port }}
              name: metrics
            {{- end }}
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            {{- if (include "dynamic-config.installationDocument" .) }}
            - { name: installation, mountPath: /etc/dynamic-config, readOnly: true }
            {{- end }}
            {{- with .Values.webhook.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext: {{- include "dynamic-config.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.webhook.resources | nindent 12 }}
          readinessProbe:
            {{/* Ready means a certificate this process can serve with is
                 loaded — which in selfRotate mode is false for the first
                 minute, while the kubelet syncs the minted pair. A replica
                 that reported Ready without one would have the Service
                 send it admissions it cannot complete a handshake for. */}}
            httpGet: { path: /readyz, port: {{ .Values.webhook.port }}, scheme: HTTPS }
            initialDelaySeconds: {{ .Values.webhook.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.webhook.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.webhook.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.webhook.port }}, scheme: HTTPS }
            {{- if $selfRotate }}
            {{/* The first minted pair rides the kubelet's secret sync
                 (up to a minute); a liveness clock tuned for mounted-at-
                 start certificates would kill the pod mid-wait. */}}
            initialDelaySeconds: {{ max 90 (.Values.webhook.livenessProbe.initialDelaySeconds | int) }}
            {{- else }}
            initialDelaySeconds: {{ .Values.webhook.livenessProbe.initialDelaySeconds }}
            {{- end }}
            periodSeconds: {{ .Values.webhook.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.webhook.livenessProbe.failureThreshold }}
      volumes:
        {{- if (include "dynamic-config.installationDocument" .) }}
        - name: installation
          configMap:
            name: {{ $fullname }}-installation
        {{- end }}
        - name: tls
          secret:
            secretName: {{ $fullname }}-tls
            {{- if $selfRotate }}
            # The pod starts before the first pair is minted; the mount
            # fills when the rotation loop writes the Secret.
            optional: true
            {{- end }}
        {{- with .Values.webhook.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.webhook.service.annotations .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.webhook.service.type }}
  selector: {{- include "dynamic-config.webhook.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.webhook.service.port }}
      targetPort: {{ .Values.webhook.port }}
      name: https
    {{- if .Values.webhook.metrics.enabled }}
    - port: {{ .Values.webhook.metrics.port }}
      targetPort: metrics
      name: metrics
    {{- end }}
{{- if and .Values.webhook.metrics.enabled .Values.webhook.metrics.serviceMonitor.enabled }}
---
{{/* Only where the Prometheus operator's CRD exists — hence opt-in
     rather than a capability check, which would silently do nothing on a
     cluster that installs the CRD later. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
    {{- with .Values.webhook.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  selector:
    matchLabels: {{- include "dynamic-config.webhook.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.webhook.metrics.serviceMonitor.interval }}
{{- end }}
{{- if .Values.webhook.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  minAvailable: {{ .Values.webhook.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "dynamic-config.webhook.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Both facts about the webhook's traffic, written down: only the API
# server calls in (it has no stable selector, so the ingress rule is
# port-shaped), and nothing goes out at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  podSelector:
    matchLabels: {{- include "dynamic-config.webhook.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
  {{- if $selfRotate }}
  # selfRotate calls the API server (lease, secret, caBundle); the API
  # server has no stable selector, so the rule is port-shaped.
  egress:
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 6443, protocol: TCP }
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "dynamic-config.fullname" . }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- if or .Values.webhook.certManager.enabled .Values.commonAnnotations }}
  annotations:
    {{- if .Values.webhook.certManager.enabled }}
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/{{ $fullname }}"
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
webhooks:
  - name: inject.dynamic-config.rs
    clientConfig:
      {{- if and (not .Values.webhook.certManager.enabled) (not $selfRotate) }}
      caBundle: {{ $tls.ca }}
      {{- end }}
      service:
        name: {{ $fullname }}
        namespace: "{{ .Release.Namespace }}"
        path: /mutate
        port: {{ .Values.webhook.service.port }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    # Never the control plane's namespaces, never this chart's own — a
    # webhook that can select its own pods can deadlock its own rollout.
    namespaceSelector:
      matchExpressions:
        {{- if .Values.webhook.namespaceGating }}
        - key: dynamic-config.rs/injection
          operator: In
          values: [enabled]
        {{- end }}
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-node-lease
            - {{ .Release.Namespace }}
            {{- range .Values.webhook.excludeNamespaces }}
            - {{ . }}
            {{- end }}
    {{- with .Values.webhook.objectSelector }}
    objectSelector: {{- toYaml . | nindent 6 }}
    {{- end }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    matchPolicy: Equivalent
    reinvocationPolicy: {{ .Values.webhook.reinvocationPolicy }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
