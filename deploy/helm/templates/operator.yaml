{{- if .Values.operator.enabled }}
{{- $fullname := include "dynamic-config.operator.fullname" . }}
{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dynamic-config.operator.serviceAccountName" . }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.operator.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.operator.rbac.create }}
# Least privilege for what the reconcilers do: watch the two
# CRDs, own the ConfigMaps they render, record events. Nothing cluster-
# shaping — no pods, no secrets beyond reads the classes name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dynamic-config.rs"]
    resources: ["dynamicconfigclasses", "clusterdynamicconfigclasses", "dynamicconfigrenders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dynamic-config.rs"]
    resources: ["dynamicconfigrenders/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # `get` for the token Secrets classes name; the write verbs because a
  # Render's `secret:` target IS a Secret this operator owns and
  # reconciles. `create` cannot be name-scoped in RBAC — the trade of
  # writing Secrets at all, taken here and stated.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dynamic-config.operator.serviceAccountName" . }}
    namespace: "{{ .Release.Namespace }}"
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  # More than one is spare capacity, not more throughput: the replicas
  # contend for a Lease and only the holder reconciles. Two means a leader
  # that dies is replaced within the lease's term instead of when the
  # kubelet gets round to restarting it.
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: {{- include "dynamic-config.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dynamic-config.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (merge (dict) .Values.operator.podAnnotations .Values.commonAnnotations) }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dynamic-config.operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.operator.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "dynamic-config.image" (dict "component" .Values.operator "root" $) | quote }}
          imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
          env:
            # The Lease's holder identity, and where to write it. A pod
            # name is unique in a namespace, so two replicas cannot claim
            # to be the same holder and a restarted pod does not inherit
            # its predecessor's term.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 9090
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          securityContext: {{- include "dynamic-config.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
{{- if and .Values.operator.podDisruptionBudget.enabled (gt (int .Values.operator.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels: {{- include "dynamic-config.labels" . | nindent 4 }}
  {{- include "dynamic-config.annotations" . | nindent 2 }}
spec:
  # Only meaningful above one replica, which is why the guard above exists:
  # a budget of `minAvailable: 1` over a single replica blocks every node
  # drain in the cluster, which is a worse outage than the one it prevents.
  {{- toYaml .Values.operator.podDisruptionBudget.spec | nindent 2 }}
  selector:
    matchLabels: {{- include "dynamic-config.operator.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
