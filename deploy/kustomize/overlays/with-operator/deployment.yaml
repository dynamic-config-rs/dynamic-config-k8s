apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-config-operator
  namespace: dynamic-config
  labels:
    app.kubernetes.io/name: dynamic-config
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-config
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-config
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: dynamic-config-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/dynamic-config-rs/dynamic-config-operator:v0.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
