apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: dynamic-config
webhooks:
  - name: inject.dynamic-config.rs
    clientConfig:
      # caBundle is the overlay's business: cert-manager's cainjector
      # fills it in one overlay; the own-cert overlay documents the
      # one-line patch for the other.
      service:
        name: dynamic-config-webhook
        namespace: dynamic-config
        path: /mutate
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-node-lease, dynamic-config]
    failurePolicy: Ignore
    timeoutSeconds: 5
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    admissionReviewVersions: ["v1"]
    sideEffects: None
