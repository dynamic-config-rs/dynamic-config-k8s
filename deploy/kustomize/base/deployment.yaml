apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-config-webhook
  namespace: dynamic-config
  labels:
    app.kubernetes.io/name: dynamic-config
    app.kubernetes.io/component: webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-config
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-config
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: dynamic-config-webhook
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dynamic-config
              app.kubernetes.io/component: webhook
      containers:
        - name: webhook
          image: ghcr.io/dynamic-config-rs/dynamic-config-webhook:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DYNAMIC_CONFIG_AGENT_IMAGE
              value: ghcr.io/dynamic-config-rs/dynamic-config-agent:0.1.0
            - name: DYNAMIC_CONFIG_WEBHOOK_ADDR
              value: "0.0.0.0:8443"
            - name: DYNAMIC_CONFIG_AGENT_CPU_REQUEST
              value: "10m"
            - name: DYNAMIC_CONFIG_AGENT_MEMORY_REQUEST
              value: "32Mi"
            - name: DYNAMIC_CONFIG_AGENT_MEMORY_LIMIT
              value: "64Mi"
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
            periodSeconds: 20
      volumes:
        - name: tls
          secret:
            secretName: dynamic-config-webhook-tls
