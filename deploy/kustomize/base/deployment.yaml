apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-config-webhook
  namespace: dynamic-config
  labels:
    app.kubernetes.io/name: dynamic-config
    app.kubernetes.io/component: webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-config
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-config
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: dynamic-config-webhook
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dynamic-config
              app.kubernetes.io/component: webhook
      containers:
        - name: webhook
          image: ghcr.io/dynamic-config-rs/dynamic-config-webhook:v0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DYNAMIC_CONFIG_AGENT_IMAGE
              value: ghcr.io/dynamic-config-rs/dynamic-config-agent:v0.1.1
            - name: DYNAMIC_CONFIG_WEBHOOK_ADDR
              value: "0.0.0.0:8443"
            - name: DYNAMIC_CONFIG_AGENT_CPU_REQUEST
              value: "10m"
            - name: DYNAMIC_CONFIG_AGENT_MEMORY_REQUEST
              value: "32Mi"
            - name: DYNAMIC_CONFIG_AGENT_MEMORY_LIMIT
              value: "64Mi"
            # Optional fleet defaults, per-store defaults and the gates —
            # set via an overlay patch; empty means unset, and the webhook
            # validates every value at startup:
            #   DYNAMIC_CONFIG_AGENT_FILE_MODE          "0640"
            #   DYNAMIC_CONFIG_AGENT_WATCH_SECONDS      "30"
            #   DYNAMIC_CONFIG_AGENT_MODE               "both"
            #   DYNAMIC_CONFIG_AGENT_VOLUME_MEDIUM      "disk"
            #   DYNAMIC_CONFIG_AGENT_NATIVE_SIDECAR     "true"
            #   DYNAMIC_CONFIG_AGENT_RUN_AS_USER        "1000"
            #   DYNAMIC_CONFIG_AGENT_RUN_AS_GROUP       "1000"
            #   DYNAMIC_CONFIG_AGENT_METRICS_PORT       "9102"
            #   DYNAMIC_CONFIG_AGENT_ENV                "HTTPS_PROXY=http://egress:3128"
            #   DYNAMIC_CONFIG_AGENT_SOURCE             "consul"   ("!" pins, "?" opens)
            #   DYNAMIC_CONFIG_AGENT_PATH               "/config/rendered.toml"
            #   DYNAMIC_CONFIG_AGENT_DEFAULTS_OVERRIDABLE "false"  (pins every set value)
            #   DYNAMIC_CONFIG_AGENT_STORE_DEFAULTS     "vault: overridable=false, endpoint=https://vault:8200, auth=kubernetes; s3: file-mode=0640?"
            #     ("!" pins a value, "?" opens one, overridable=false pins a store's group)
            #   DYNAMIC_CONFIG_WEBHOOK_AGENT_ENV_ALLOW  "payments: HTTPS_PROXY; *: RUST_LOG"
            #   DYNAMIC_CONFIG_WEBHOOK_SOURCE_ALLOW     "payments: vault, s3; *: consul"
            #   DYNAMIC_CONFIG_WEBHOOK_SOURCE_DENY      "sandbox: git"
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
            periodSeconds: 20
      volumes:
        - name: tls
          secret:
            secretName: dynamic-config-webhook-tls
