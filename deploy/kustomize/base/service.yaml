apiVersion: v1
kind: Service
metadata:
  name: dynamic-config-webhook
  namespace: dynamic-config
spec:
  selector:
    app.kubernetes.io/name: dynamic-config
    app.kubernetes.io/component: webhook
  ports:
    - port: 443
      targetPort: 8443
      name: https
    # Named, so a ServiceMonitor or a relabel rule can keep it by name
    # rather than by number.
    - port: 9091
      targetPort: metrics
      name: metrics
