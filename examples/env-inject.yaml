# Real OS environment variables from a store: the
# process reads env, not files. An init agent renders a dotenv, and
# `env-inject` wraps the named container's command in
# `set -a; . /config/app.env; set +a; exec …`, so the variables are the
# process's REAL environment from its first instruction.
#
# Honest physics, stated: environment variables freeze at container
# start (Kubernetes' rule, not this webhook's) — which is why
# `env-inject` requires mode init or both, and why a changed document
# reaches the env only on the next pod start. A consumer that can read
# files gets live reloads instead; this shape is for the ones that
# cannot.
apiVersion: v1
kind: Pod
metadata:
  name: scheduler
  annotations:
    dynamic-config.rs/inject: "true"
    dynamic-config.rs/mode: "init"
    dynamic-config.rs/source: "consul"
    dynamic-config.rs/endpoint: "http://consul.infra.svc:8500"
    dynamic-config.rs/key: "myapp/config.json"
    dynamic-config.rs/path: "/config/app.env"
    dynamic-config.rs/template: |
      DB_HOST={{ db.host }}
      DB_PORT={{ db.port }}
    dynamic-config.rs/env-inject: "app"
spec:
  containers:
    - name: app
      image: busybox:1.36
      # An explicit command is REQUIRED: an image ENTRYPOINT is
      # invisible to the webhook, and the refusal says so by name.
      command: ["sh", "-c", "echo DB_HOST=$DB_HOST DB_PORT=$DB_PORT; sleep 3600"]
