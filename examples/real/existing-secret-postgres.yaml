# The `existingSecret` contract, the real thing: bitnami/postgresql (like
# half the chart ecosystem) takes `auth.existingSecret` — a Secret whose
# KEY NAMES the chart already decided (`postgres-password`,
# `replication-password`). `shape: entries` keeps every leaf VERBATIM,
# so the store document's own spelling becomes exactly the keys the
# chart demands, and the password never appears in values, in git, or in
# a developer's hands.
#
# Store document (vault kv secret/postgres — a vault class is allowed
# into a Secret target, and this is why):
#   {"postgres-password": "…", "replication-password": "…"}
apiVersion: dynamic-config.rs/v1alpha1
kind: DynamicConfigRender
metadata:
  name: postgres-credentials
spec:
  class: platform-vault          # a ClusterDynamicConfigClass, typically
  classKind: ClusterDynamicConfigClass
  key: secret/postgres
  target:
    secret: pg-credentials
    shape: entries               # keys verbatim: postgres-password, …
  intervalSeconds: 60
# …and the chart simply names it:
#
#   helm install db bitnami/postgresql \
#     --set auth.existingSecret=pg-credentials
#
# The same shape feeds any operator whose CRD says `secretName:` — the
# Secret exists before the consumer looks, and stays reconciled after.
