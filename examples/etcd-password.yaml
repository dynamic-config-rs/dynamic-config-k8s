# etcd with username/password — etcd's other native method, supported
# deliberately and forever: not every store will ever speak workload
# identity, and a contract that punishes those stores punishes their
# users. The user rides an annotation; the password rides a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: etcd-password
stringData:
  password: REPLACE-WITH-THE-PASSWORD
---
apiVersion: v1
kind: Pod
metadata:
  name: billing
  annotations:
    dynamic-config.rs/inject: "true"
    dynamic-config.rs/source: "etcd"
    dynamic-config.rs/endpoint: "https://etcd.infra.svc:2379"
    dynamic-config.rs/key: "myapp/config.json"
    dynamic-config.rs/path: "/config/rendered.toml"
    dynamic-config.rs/auth-username: "myapp"
    dynamic-config.rs/password-secret: "etcd-password/password"
    dynamic-config.rs/ca-configmap: "etcd-ca"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo ── $(date); cat /config/rendered.toml; sleep 30; done"]
