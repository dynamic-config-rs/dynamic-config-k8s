# Consul with ACLs on: the token rides a Secret and reaches the agent
# as an environment variable — never an annotation, which anyone with
# `get pod` can read.
apiVersion: v1
kind: Secret
metadata:
  name: consul-token
stringData:
  token: REPLACE-WITH-YOUR-ACL-TOKEN
---
apiVersion: v1
kind: Pod
metadata:
  name: billing
  annotations:
    dynamic-config.rs/inject: "true"
    dynamic-config.rs/source: "consul"
    dynamic-config.rs/endpoint: "http://consul.infra.svc:8500"
    dynamic-config.rs/key: "myapp/config.json"
    dynamic-config.rs/path: "/config/rendered.toml"
    dynamic-config.rs/token-secret: "consul-token/token"
spec:
  containers:
    - name: app
      image: myapp:1
