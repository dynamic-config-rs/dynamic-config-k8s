# A store document as a Kubernetes Secret, minimal form: defaults do the
# rest (shape: file, intervalSeconds: 15, classKind: the namespaced
# Class). Consumers that WATCH Secrets react with no restart; envFrom
# consumers pick changes up at their next start — the book's Three
# Deliveries page carries the physics.
apiVersion: dynamic-config.rs/v1alpha1
kind: DynamicConfigClass
metadata:
  name: infra-consul
spec:
  source: consul
  endpoint: http://consul.infra.svc:8500
---
apiVersion: dynamic-config.rs/v1alpha1
kind: DynamicConfigRender
metadata:
  name: myapp-env
spec:
  class: infra-consul
  key: myapp/config.json
  target:
    secret: myapp-env
    shape: envEntries        # leaves as DB_HOST-style entries, for envFrom
---
apiVersion: v1
kind: Pod
metadata:
  name: worker
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "env | grep DB_; sleep 3600"]
      envFrom:
        - secretRef: { name: myapp-env }
