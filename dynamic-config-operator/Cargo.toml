[package]
name = "dynamic-config-operator"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Operator: DynamicConfigClass store bundles and DynamicConfigRender reconciliation to ConfigMaps"
publish = false   # ships as an image, not a crate

[dependencies]
# kube-rs and the API types. `latest` feature pins the k8s API version
# the CRDs are generated against; runtime brings the Controller.
kube = { version = "1", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.25", features = ["latest"] }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = "0.3"
thiserror = "2"
