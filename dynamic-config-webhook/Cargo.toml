[package]
name = "dynamic-config-webhook"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Mutating admission webhook: injects the dynamic-config agent into annotated pods"
publish = false   # ships as an image, not a crate

[dependencies]
# The admission endpoint. Plain axum: the organisation's own adapter
# hands a snapshot to a handler, and this server has no configuration to
# hand — its own installation is read once at startup and never reloads,
# because an admission decision must not change under a pod mid-flight.
axum = { version = "0.8.1", features = ["json", "tokio", "http1"] }
# `yaml` for the installation document: a ConfigMap somebody writes by
# hand is YAML, and this crate reads YAML — the webhook reading its own
# configuration through its own engine is the shortest honest path.
dynamic-config = { workspace = true, features = ["json", "yaml", "watch"] }
serde_json = { workspace = true }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }
# TLS termination, the same shape and the same reasons as the config
# server's serve.rs: tokio-rustls for the handshake, hyper's own HTTP/1
# connection for what follows, `ring` rather than a vendored AWS-LC.
arc-swap = "1.7"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1.7", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.16", default-features = false, features = ["service", "tokio"] }
tracing-subscriber = { workspace = true }
# The selfRotate TLS mode: mint the CA and leaf in memory (rcgen),
# write the pair to the chart's Secret and patch the MWC's caBundle
# (kube), coordinate rotation across replicas with a Lease.
kube = { version = "1", default-features = false, features = ["client", "rustls-tls", "jsonpatch"] }
json-patch = "4"
k8s-openapi = { version = "0.25", features = ["latest"] }
rcgen = "0.13"
# `rcgen` states a certificate's validity in `time`'s types, and this
# project states one explicitly rather than taking the library's default.
# Already in the graph through rcgen, so depending on it directly costs no
# compilation — only the constructors rcgen does not re-export.
time = { version = "0.3.36", default-features = false, features = ["std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"

[dev-dependencies]
tempfile = "3"
