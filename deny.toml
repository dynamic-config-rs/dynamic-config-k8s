# cargo-deny for the k8s workspace: three image binaries over the engine
# and the store crates. h2 here is the 0.4 line (patched); the tree was
# OSV-batch-scanned clean at 0.7-floor time, so the ignore list starts
# EMPTY — an entry here needs an advisory that names this graph.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
# Permissive only, the organisation's list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
