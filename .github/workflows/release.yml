name: Release

# Merging a version bump into `main` IS the release — the wheel wave's
# shape, aimed at registries. The `decide` job checks whether the
# workspace version is new; a docs merge is a green no-op and a version
# bump builds the four images, each architecture on its own runner
# rather than under QEMU, pushes them by digest to ghcr.io and Docker Hub,
# and joins them into one index per registry — so the digest a consumer
# pulls is the index's. It signs that index with cosign keyless, attaches
# SBOM and provenance to the per-architecture images beneath it (an index
# does not carry attestations up), pushes the chart as OCI with its
# ArtifactHub metadata, and mints the tag last — a tag marks what actually
# shipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR: ghcr.io/${{ github.repository_owner }}
  # The repository variable, with NO fallback: a missing variable must
  # fail the login loudly, never push to a guessed account.
  DOCKERHUB: docker.io/${{ vars.DOCKERHUB_USERNAME }}

jobs:
  decide:
    name: is this a release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — this push is a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify before shipping
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: the changelog names this version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no section for $VERSION"
            exit 1
          fi

      # One version, three places: the workspace, the chart, and what the
      # chart deploys. A release where they disagree ships images the
      # chart does not reference.
      - name: the chart agrees on the version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          chart=$(grep -m1 '^version:' deploy/helm/Chart.yaml | awk '{print $2}')
          app=$(grep -m1 '^appVersion:' deploy/helm/Chart.yaml | tr -d '"' | awk '{print $2}')

          if [ "$chart" != "$VERSION" ] || [ "$app" != "$VERSION" ]; then
            echo "::error file=deploy/helm/Chart.yaml::chart $chart / appVersion $app, workspace $VERSION"
            exit 1
          fi

      # The agent's etcd store compiles its gRPC stubs at build time.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  images:
    name: ${{ matrix.component }} ${{ matrix.arch }}
    needs: [decide, verify]
    if: needs.decide.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    # Was 210 minutes because the arm64 half compiled a Rust workspace
    # under QEMU — 1h39m for the agent on 0.2.0. Each half now builds on
    # its own architecture, so neither emulates anything.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Two dimensions, eight jobs. `arch` has to be a dimension rather
        # than something `include` adds: an `include` entry whose keys are
        # all absent from the matrix is merged into *every* combination,
        # so two such entries left four jobs that all agreed they were
        # arm64 and no amd64 build at all. `runner` is what `include`
        # is for — it keys off a dimension that already exists.
        component: [agent, webhook, operator, node-agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Free for public repositories, which this is.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `setup-qemu-action`: nothing is emulated any more, and leaving
      # it installed would quietly re-enable the slow path if a platform
      # were ever added back to the build below.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed **by digest**, with no tag: a tag naming one architecture
      # would be wrong for half the fleet between this job and the join
      # below. The manifest list that carries both is assembled there.
      #
      # `provenance` and `sbom` stay here rather than moving to the join:
      # they attest what was *built*, and what was built is one
      # architecture. `SECURITY.md` says which digest carries which.
      # **One registry per step, and ghcr's digest is the one that
      # travels.** Both registries in one step exports two manifest lists,
      # not one — the provenance attestation records the image name it was
      # built for, so the index differs per registry — and the action can
      # only report one `digest`. It reported Docker Hub's, the join looked
      # it up on ghcr, and the release stopped there.
      #
      # The join assembles *both* registries' lists out of the ghcr
      # digests, so ghcr is the one it has to be given. Docker Hub gets its
      # per-architecture images here and its index there.
      - name: build and push by digest, ghcr
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          # Per component **and** per architecture: one scope shared by two
          # legs is two legs overwriting each other's entry.
          cache-from: type=gha,scope=image-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.component }}-${{ matrix.arch }}
          outputs: |
            type=image,name=${{ env.GHCR }}/dynamic-config-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true

      # A cache hit on everything above; what this costs is the push.
      - name: build and push by digest, Docker Hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.component }}-${{ matrix.arch }}
          outputs: |
            type=image,name=${{ env.DOCKERHUB }}/dynamic-config-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true

      # One file per leg, named for the digest: the join needs both, and a
      # matrix cannot hand a value back any other way.
      - name: hand the digest to the join
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: ${{ matrix.component }} manifest list, both registries
    needs: [decide, images]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless: the certificate names this workflow
    strategy:
      fail-fast: false
      matrix:
        component: [agent, webhook, operator, node-agent]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true
          path: /tmp/digests

      # The manifest list, from the two digests, once per registry. Both
      # lists are built from the same per-architecture digests, so the two
      # index digests are equal — which the assertion below still checks,
      # because "equal by construction" is a claim worth failing on.
      - name: assemble, per registry
        id: manifest
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail

          sources=""
          for digest in /tmp/digests/*; do
            sources="$sources ${GHCR}/dynamic-config-${COMPONENT}@sha256:$(basename "$digest")"
          done

          echo "joining:$sources"

          for registry in "${GHCR}" "${DOCKERHUB}"; do
            # shellcheck disable=SC2086
            docker buildx imagetools create \
              --tag "${registry}/dynamic-config-${COMPONENT}:v${VERSION}" \
              --tag "${registry}/dynamic-config-${COMPONENT}:latest" \
              $sources
          done

          index=$(docker buildx imagetools inspect \
            "${GHCR}/dynamic-config-${COMPONENT}:v${VERSION}" \
            --format '{{.Manifest.Digest}}')

          echo "digest=$index" >> "$GITHUB_OUTPUT"

      # The **index**, not the per-architecture digests. `README.md` tells
      # a user to `cosign verify …:v<version>`, and a tag resolves to the
      # index — signing what was pushed underneath it would leave that
      # command failing against images that are perfectly genuine.
      - name: cosign sign the index, both registries
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          cosign sign --yes "${GHCR}/dynamic-config-${COMPONENT}@${DIGEST}"
          cosign sign --yes "${DOCKERHUB}/dynamic-config-${COMPONENT}@${DIGEST}"

      - name: the digests match across registries
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          VERSION: ${{ needs.decide.outputs.version }}
          COMPONENT: ${{ matrix.component }}
        run: |
          on_ghcr=$(docker buildx imagetools inspect \
            "${GHCR}/dynamic-config-${COMPONENT}:v${VERSION}" --format '{{json .Manifest.Digest}}')
          on_hub=$(docker buildx imagetools inspect \
            "${DOCKERHUB}/dynamic-config-${COMPONENT}:v${VERSION}" --format '{{json .Manifest.Digest}}')

          echo "ghcr: $on_ghcr"
          echo "hub:  $on_hub"
          [ "$on_ghcr" = "$on_hub" ] && [ "$on_ghcr" = "\"${DIGEST}\"" ]

      # Both architectures, in the list a `docker pull` will read.
      - name: the list carries both architectures
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          COMPONENT: ${{ matrix.component }}
        run: |
          platforms=$(docker buildx imagetools inspect \
            "${GHCR}/dynamic-config-${COMPONENT}:v${VERSION}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')

          echo "platforms: $platforms"

          case "$platforms" in
            *linux/amd64*) ;;
            *) echo "no linux/amd64 in the manifest list" >&2; exit 1 ;;
          esac
          case "$platforms" in
            *linux/arm64*) ;;
            *) echo "no linux/arm64 in the manifest list" >&2; exit 1 ;;
          esac

  chart:
    name: chart to ghcr + ArtifactHub metadata
    # `manifest`, not `images`: the tags a chart's appVersion points at
    # do not exist until the manifest lists are assembled.
    needs: [decide, manifest]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: helm login to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # cosign reads the DOCKER config, and `helm registry login` writes
      # helm's own — which is why the push succeeded and the signature
      # that followed it was refused as unauthenticated. Both logins, or
      # a chart nobody can verify.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: package and push the chart
        id: push
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          helm package deploy/helm
          out=$(helm push "dynamic-config-${VERSION}.tgz" "oci://${GHCR}/charts" 2>&1)
          echo "$out"
          digest=$(echo "$out" | grep -o 'sha256:[a-f0-9]*' | head -1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: sign the chart
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${GHCR}/charts/dynamic-config@${DIGEST}"

      # The repository-metadata layer ArtifactHub reads beside the chart;
      # the claim on artifacthub.io is a one-time console action after the
      # first release lands.
      - name: push the ArtifactHub metadata
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$TOKEN"
          oras push "${GHCR}/charts/dynamic-config:artifacthub.io" \
            --artifact-type application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  tag-and-release:
    name: tag and GitHub release
    # Likewise: minting the tag before the manifest lists exist would
    # publish a release naming images nobody can pull.
    needs: [decide, manifest, chart]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Minted only after every artifact is on its registry: the tag
      # marks what actually shipped.
      - name: tag the release
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "dynamic-config-k8s $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: the changelog section, as the release body
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > body.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: dynamic-config-k8s ${{ needs.decide.outputs.version }}
          body_path: body.md
