name: Security

# Advisories are published on someone else's schedule, so this runs on one
# of its own as well as on every change. No push trigger for `dev` — dev
# travels through pull requests, and a push twin under required checks
# poisons the gate.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  unsafe:
    name: no unsafe code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every binary and the webhook's library declare
      # `#![forbid(unsafe_code)]`; this proves the declarations are still
      # there rather than trusting nobody removed one in a hurry.
      - run: |
          for root in dynamic-config-agent/src/main.rs \
                      dynamic-config-webhook/src/lib.rs \
                      dynamic-config-operator/src/main.rs; do
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$root"; then
              echo "::error file=$root::missing #![forbid(unsafe_code)]"
              exit 1
            fi
          done

  supply-chain:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No allow-ghsas: this tree was OSV-batch-scanned clean when the 0.7
      # floors landed. The first entry here needs the same three-ledger
      # answer the sibling repositories give.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure

  security-ok:
    name: Security is green
    needs: [deny, unsafe, supply-chain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
