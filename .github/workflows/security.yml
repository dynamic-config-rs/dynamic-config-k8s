name: Security

# Advisories are published on someone else's schedule, so this runs on one
# of its own as well as on every change. No push trigger for `dev` — dev
# travels through pull requests, and a push twin under required checks
# poisons the gate.
on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: the security policy names the current line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The stale-table drift this org has already lived through once:
      # SECURITY.md said 0.0.x while the workspace shipped 0.7. The table's
      # top row must name the line that is actually published.
      - run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          line="${version%.*}.x"
          if ! grep -qF "| ${line}" SECURITY.md; then
            echo "::error file=SECURITY.md::the supported-versions table does not name ${line} (workspace is ${version})"
            exit 1
          fi
          echo "SECURITY.md names ${line} — current"

  # deny, the unsafe sweep and dependency review are the org's shared
  # definition, pinned to the `v1` tag rather than to `main`: a shared
  # workflow on a branch is every repository in the org running whatever
  # was pushed there last. The operator has no lib.rs, so it rides the
  # `bins` input; the agent and webhook appear in both — their libraries
  # and their binaries each carry the forbid.
  shared:
    # The caller's grant must COVER every permission a called job asks
    # for — the callee's dependency review comments on pull requests,
    # and a callee cannot exceed what this block hands it. Leaving it
    # off inherits the workflow's bare `contents: read` and fails the
    # whole call at startup.
    permissions:
      contents: read
      pull-requests: write
    uses: dynamic-config-rs/.github/.github/workflows/reusable-security-rust.yml@v1
    with:
      crates: dynamic-config-agent dynamic-config-webhook
      bins: dynamic-config-agent dynamic-config-webhook dynamic-config-operator

  security-ok:
    name: Security is green
    needs: [policy, shared]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
