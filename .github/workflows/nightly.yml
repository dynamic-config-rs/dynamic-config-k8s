name: Nightly

# The long legs PRs cannot afford: the selfRotate rotation soak —
# hourly rotations under admission load, zero refused handshakes across
# every rotation — and the full e2e ladder against a fresh kind.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation-soak:
    name: selfRotate soak, hourly rotations under load
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1
        with:
          install_only: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: just
      - run: e2e/rotation-soak.sh
        env:
          SOAK_HOURS: "5"

  # The three images, built once for the whole run.
  #
  # Each e2e leg used to build all three itself: three legs, nine builds,
  # every one of them compiling the same dependency graph from nothing.
  # Now one job builds them, and the legs load a tarball.
  images:
    name: the images, once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: just

      # One dependency build behind all three, cached across runs: the
      # cook layer is invalidated by a dependency change and by nothing
      # else, so an ordinary night pays for this project's own code.
      - name: build, into the local daemon
        run: |
          for component in agent webhook operator; do
            docker buildx build \
              --file docker/Dockerfile \
              --target "$component" \
              --tag "dynamic-config-$component:dev" \
              --cache-from "type=gha,scope=e2e-$component" \
              --cache-to "type=gha,mode=max,scope=e2e-$component" \
              --load .
          done

      - run: just images-save images.tar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-images
          path: images.tar
          retention-days: 1

  e2e-ladder:
    name: the full e2e ladder
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # `upgrade` is here rather than in the pull-request suite because
        # it installs a *published* chart from a registry: it is the one
        # leg that is not hermetic, and the one that catches what only an
        # upgrade can — CRDs Helm will not touch, and a `caBundle` the
        # chart would happily render empty over.
        # `scale` is output rather than a gate: a shared runner cannot
        # produce a number worth publishing as a guarantee, and a
        # threshold tuned on one would fail on another. It fails only on
        # what is qualitatively wrong — a refusal, or an admission that ate
        # a second of the API server's ten.
        leg: [smoke, operator-smoke, stores-smoke, upgrade, scale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1
        with:
          install_only: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: just

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-images
      - run: docker load -i images.tar

      # The scripts build the images themselves when they are run by hand;
      # here they are already loaded, and `just images` would rebuild them.
      - run: e2e/${{ matrix.leg }}.sh
        env:
          IMAGES_PRELOADED: "1"

  # The published images age between releases: base-image CVEs accrue
  # while the tags stand still. This scans what users actually pull —
  # every night, HIGH and CRITICAL with a fix available fail the job,
  # and a red nightly here is the signal to cut a patch release.
  image-cves:
    name: published ${{ matrix.component }} image CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [agent, webhook, operator]
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/dynamic-config-rs/dynamic-config-${{ matrix.component }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
