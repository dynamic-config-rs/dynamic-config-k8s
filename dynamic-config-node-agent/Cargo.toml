[package]
name = "dynamic-config-node-agent"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "A per-node DaemonSet that fetches configuration once for every pod on the node and delivers it as a CSI volume"
publish = false   # ships as an image, not a crate

[dependencies]
# The whole agent, as a library: the spec, the sources, the renderer and
# the watch loop are the same code the sidecar runs. A second
# implementation of "fetch, resolve, render, watch" is the thing this
# component must not become.
dynamic-config-agent = { path = "../dynamic-config-agent" }
dynamic-config = { workspace = true, features = ["json", "toml", "yaml", "ini", "properties", "watch", "tracing"] }
dynamic-config-telemetry = { path = "../dynamic-config-telemetry" }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server", "codegen", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
