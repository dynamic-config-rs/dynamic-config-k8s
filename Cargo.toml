[workspace]
members = [
    "dynamic-config-agent",
    "dynamic-config-telemetry",
    "dynamic-config-webhook",
    "dynamic-config-operator",
    "dynamic-config-node-agent",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dynamic-config-rs/dynamic-config-k8s"
homepage = "https://dynamic-config-rs.github.io/k8s/"
authors = ["Cevat Batuhan Tolon"]

[workspace.dependencies]
# The engine, for resolving; the stores, for fetching. Carets: the agent
# is an application, and an engine patch should reach it on rebuild.
#
# **These move to 0.9 at release time.** The watch contract the agent
# drives is the engine's 0.9 and the stores' 0.9; the patch table at the
# bottom of this file points at the working trees that carry it, which are
# still numbered 0.8. Bump both together, and delete the patch table.
dynamic-config = { version = "0.10", default-features = false }
dynamic-config-consul = "0.10"
dynamic-config-vault = "0.10"
dynamic-config-server = { version = "0.10", default-features = false, features = ["client", "tls"] }
dynamic-config-firestore = "0.10"
dynamic-config-store-core = "0.10"
minijinja = "2"
dynamic-config-git = "0.10"
dynamic-config-redis = { version = "0.10", features = ["tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The meta file's digest. Already in the graph through the engine; named
# here so the agent can hash the bytes it just wrote.
sha2 = { version = "0.11", default-features = false }
# Transport credentials are wiped when they go. Not the resolved document —
# that has to be plaintext to be written — but the token, the password and
# the keys used to *reach* a store have no reason to outlive their use.
zeroize = { version = "1", features = ["alloc"] }
# Optional schema validation at the agent boundary.
#
# `default-features = false` drops the HTTP and file `$ref` resolvers and
# the TLS stack that comes with them — deliberately. A schema arrives as a
# mounted ConfigMap, and a validator that could fetch a `$ref` over the
# network would be a config agent making requests on a schema's say-so:
# the same class of hazard as a template that can reach a store, which this
# family already refuses.
jsonschema = { version = "0.50", default-features = false }
# OpenTelemetry, in the binaries rather than in a library.
#
# The engine offers an `otel` feature that records into a meter somebody
# else configured; *somebody else* is here. These three are programs, so
# owning the pipeline, the runtime and the shutdown is their job — which is
# exactly why the engine refuses to.
#
# Compiled in and dormant: nothing is exported unless
# `OTEL_EXPORTER_OTLP_ENDPOINT` is set, so no existing deployment changes.
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "metrics",
    "trace",
] }
tracing-opentelemetry = "0.33"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# The 0.2.0 stores — async clients, driven by the agent's tokio runtime.
dynamic-config-etcd = { version = "0.10", features = ["tls"] }
dynamic-config-nats = "0.10"
dynamic-config-s3 = "0.10"
# `signal` beside the rest: a lease has to be handed back when the pod is
# asked to stop, and a process that cannot hear SIGTERM cannot hand
# anything back.
tokio = { version = "1.52", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "signal",
    # The delivery slot: a `watch` channel, so the newest document replaces
    # one that has not been rendered yet instead of queueing behind it.
    "sync",
] }
aws-config = "1"
