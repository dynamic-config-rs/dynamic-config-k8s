apiVersion: v1
kind: Pod
metadata:
  name: annotated
  annotations:
    dynamic-config.rs/inject: "true"
    dynamic-config.rs/source: "consul"
    dynamic-config.rs/endpoint: "http://consul:8500"
    dynamic-config.rs/key: "myapp/config.json"
    dynamic-config.rs/path: "/config/rendered.toml"
    dynamic-config.rs/mode: "both"
    # The Vault-injector-parity knobs, exercised on every PR: the file
    # arrives 0640 and owned by the uid/gid the app runs as.
    dynamic-config.rs/file-mode: "0640"
    dynamic-config.rs/agent-run-as-user: "1000"
    dynamic-config.rs/agent-run-as-group: "1000"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
